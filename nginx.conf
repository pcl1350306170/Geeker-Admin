# Geeker-Admin 前端站点（8060）
# 使用方法：将本文件 include 进 nginx 主配置（conf/nginx.conf 的 http {} 块内），
# 或直接把 server 块复制进去，然后执行 nginx -s reload

server {
    listen       8060;
    server_name  localhost;

    # 打包产物目录（Windows 下用正斜杠）
    root   D:/CODE/FontEnd/Geeker-Admin/dist;
    index  index.html;

    # history 路由模式必须的回退：所有找不到的路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⭐ 推荐：接口反向代理（配合 .env.production 中 VITE_API_URL = /api）
    # 这样同事用你的局域网 IP 访问页面时，接口请求也能正确回到你的后端，
    # 且天然没有跨域问题
    location /api/ {
        proxy_pass http://localhost:8880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 注意：不要配 autoindex on，避免源码目录被列出来
}
